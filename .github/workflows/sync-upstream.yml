name: Sync upstream (kanade-milestone)

on:
  schedule:
    - cron: '0 4 * * *'  # 毎日 04:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Git 設定
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: フォーク固有ファイルを一時保存
        run: |
          mkdir -p /tmp/protected/.github/workflows
          for f in public_config.json public_data.json README.md \
                   .github/workflows/sync-upstream.yml \
                   .github/workflows/update-data.yml; do
            [ -f "$f" ] && cp "$f" "/tmp/protected/$f" || true
          done

      - name: upstream 追加・取得
        run: |
          git remote add upstream https://github.com/f2sk/kanade-milestone.git
          git fetch upstream

      - name: upstream をマージ（競合は upstream 優先）
        id: merge
        run: |
          BEFORE=$(git rev-parse HEAD)
          git merge upstream/master -X theirs --no-edit --allow-unrelated-histories
          AFTER=$(git rev-parse HEAD)
          echo "changed=$( [ "$BEFORE" != "$AFTER" ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: フォーク固有ファイルを復元
        if: steps.merge.outputs.changed == 'true'
        run: |
          for f in public_config.json public_data.json README.md \
                   .github/workflows/sync-upstream.yml \
                   .github/workflows/update-data.yml; do
            [ -f "/tmp/protected/$f" ] && cp "/tmp/protected/$f" "$f" && git add "$f" || true
          done
          git diff --cached --quiet || git commit --amend --no-edit

      - name: プッシュ
        if: steps.merge.outputs.changed == 'true'
        run: git push origin master
